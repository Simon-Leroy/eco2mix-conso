# Profil utilisé uniquement par la CI (dbt parse ne se connecte pas à la base).
# Pas de vrais identifiants ici.
dbt_eco2mix:
  target: ci
  outputs:
    ci:
      type: postgres
      host: localhost
      port: 5432
      user: ci
      password: ci
      dbname: ci
      schema: public
      threads: 1
